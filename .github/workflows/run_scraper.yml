name: TNDGE Notification Scraper Cron

on:
  schedule:
    # Triggers exactly 3 times a day:
    # 05:43 UTC -> 11:13 AM IST (Your preferred morning check)
    # 10:12 UTC -> 03:42 PM IST (Afternoon check)
    # 15:12 UTC -> 08:42 PM IST (Night check)
    - cron: '43 5 * * *'
    - cron: '12 10,15 * * *'
  workflow_dispatch: # Allows manual trigger via the GitHub Actions UI

jobs:
  scrape_and_alert:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull down your repository code (including your tndge_scraper.py and requirements.txt)
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Set up Python environment and cache based on your requirements.txt
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # Tracks changes in requirements.txt to optimize speed

    # 3. Install packages directly from your repository's requirements.txt
    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    # 4. Run your scraper script using secure environmental secrets
    - name: Run Scraper Script
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python main.py

    # 5. Commit history back to the repo if new links were detected
    - name: Commit and Save State Changes
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add seen_notifications.json
        # Only pushes code adjustments if seen_notifications.json was actually altered
        git diff --quiet && git diff --staged --quiet || (git commit -m "💾 Auto-updated notification history tracking log" && git push)